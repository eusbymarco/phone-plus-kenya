<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Submit your Phone Plus order through WhatsApp."><title>Checkout | Phone Plus</title><link rel="stylesheet" href="./css/style.css"><script src="./js/config.js" defer></script><script src="./js/products.js" defer></script><script src="./js/cart.js" defer></script><script src="./js/components.js" defer></script><script src="./js/app.js" defer></script><script src="./js/checkout.js" defer></script></head><body><header class="site-header" data-site-header></header><main class="page checkout-layout"><div><p class="eyebrow">Almost there</p><h1>Checkout</h1><p>Enter your details and send your order to Phone Plus on WhatsApp.</p><form id="checkout-form"><label for="name">Full name<input id="name" name="name" required autocomplete="name"></label><label for="phone">Phone number<input id="phone" name="phone" required type="tel" autocomplete="tel"></label><label for="location">Delivery location<input id="location" name="location" required placeholder="Town or area"></label><label for="note">Additional note <span>(optional)</span><textarea id="note" name="note" rows="4"></textarea></label><button class="button button-accent" type="submit">Send order on WhatsApp ↗</button><p data-form-feedback role="alert"></p></form></div><aside class="order-summary"><p>Order summary</p><ul data-checkout-items></ul><strong data-checkout-total></strong></aside></main><footer data-site-footer></footer></body></html>
